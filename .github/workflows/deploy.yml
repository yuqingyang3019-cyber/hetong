name: Deploy to ECS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r agent/requirements-dev.txt

      - name: Python syntax check
        run: python3 -m compileall agent

      - name: Run tests
        run: python3 -m pytest agent/tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install H5 frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build H5 frontend
        working-directory: frontend
        run: npm run build

      - name: Node syntax check
        run: node --check frontend/dist/app.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_MODEL: ${{ secrets.DASHSCOPE_MODEL }}
      DASHSCOPE_FALLBACK_MODELS: ${{ secrets.DASHSCOPE_FALLBACK_MODELS }}
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      DINGTALK_CLIENT_ID: ${{ secrets.DINGTALK_CLIENT_ID }}
      DINGTALK_CLIENT_SECRET: ${{ secrets.DINGTALK_CLIENT_SECRET }}
      DINGTALK_CORP_ID: ${{ secrets.DINGTALK_CORP_ID }}
      DINGTALK_DRIVE_SPACE_ID: ${{ secrets.DINGTALK_DRIVE_SPACE_ID }}
      DINGTALK_DRIVE_PARENT_ID: ${{ secrets.DINGTALK_DRIVE_PARENT_ID }}
      DINGTALK_DRIVE_CONFLICT_POLICY: ${{ secrets.DINGTALK_DRIVE_CONFLICT_POLICY }}
      YONBIP_APP_KEY: ${{ secrets.YONBIP_APP_KEY }}
      YONBIP_APP_SECRET: ${{ secrets.YONBIP_APP_SECRET }}
      YONBIP_GATEWAY_URL: ${{ secrets.YONBIP_GATEWAY_URL }}
      YONBIP_TOKEN_URL: ${{ secrets.YONBIP_TOKEN_URL }}
      YONBIP_TENANT_ID: ${{ secrets.YONBIP_TENANT_ID }}
      APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
      AGENT_ALLOWED_ORIGINS: ${{ secrets.AGENT_ALLOWED_ORIGINS }}
      AGENT_ALLOWED_ORIGIN_REGEX: ${{ secrets.AGENT_ALLOWED_ORIGIN_REGEX }}
    concurrency:
      group: ecs-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ECS deployment secrets
        run: |
          set -euo pipefail
          missing=""
          for var in ECS_HOST ECS_SSH_PRIVATE_KEY DASHSCOPE_API_KEY DASHSCOPE_MODEL \
            ALIYUN_ACCESS_KEY_ID ALIYUN_ACCESS_KEY_SECRET \
            DINGTALK_CLIENT_ID DINGTALK_CLIENT_SECRET DINGTALK_CORP_ID \
            DINGTALK_DRIVE_SPACE_ID DINGTALK_DRIVE_PARENT_ID APP_SESSION_SECRET; do
            if [ -z "$(printenv "$var" || true)" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "${missing# }" ]; then
            echo "::error::缺少 GitHub Actions Secrets：${missing# }"
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Build deployment image
        run: |
          docker build --tag "hetong-agui:${GITHUB_SHA}" .
          docker save "hetong-agui:${GITHUB_SHA}" | gzip > /tmp/hetong-agui-image.tar.gz

      - name: Create runtime environment file
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {
              "DASHSCOPE_API_KEY": os.environ["DASHSCOPE_API_KEY"],
              "DASHSCOPE_BASE_URL": "https://dashscope.aliyuncs.com/compatible-mode/v1",
              "DASHSCOPE_MODEL": os.environ["DASHSCOPE_MODEL"],
              "DASHSCOPE_FALLBACK_MODELS": os.environ["DASHSCOPE_FALLBACK_MODELS"],
              "DASHSCOPE_ENABLE_THINKING": "false",
              "DASHSCOPE_TIMEOUT_SECONDS": "180",
              "ALIYUN_ACCESS_KEY_ID": os.environ["ALIYUN_ACCESS_KEY_ID"],
              "ALIYUN_ACCESS_KEY_SECRET": os.environ["ALIYUN_ACCESS_KEY_SECRET"],
              "ALIYUN_OCR_ENDPOINT": "ocr-api.cn-hangzhou.aliyuncs.com",
              "ALIYUN_OCR_REGION_ID": "cn-hangzhou",
              "ALIYUN_OCR_SCENE": "Advanced",
              "ALIYUN_OCR_OUTPUT_TABLE": "true",
              "ALIYUN_OCR_LINELESS_TABLE": "false",
              "DINGTALK_CLIENT_ID": os.environ["DINGTALK_CLIENT_ID"],
              "DINGTALK_CLIENT_SECRET": os.environ["DINGTALK_CLIENT_SECRET"],
              "DINGTALK_CORP_ID": os.environ["DINGTALK_CORP_ID"],
              "DINGTALK_DRIVE_SPACE_ID": os.environ["DINGTALK_DRIVE_SPACE_ID"],
              "DINGTALK_DRIVE_PARENT_ID": os.environ["DINGTALK_DRIVE_PARENT_ID"],
              "DINGTALK_DRIVE_CONFLICT_POLICY": os.environ["DINGTALK_DRIVE_CONFLICT_POLICY"] or "AUTO_RENAME",
              "YONBIP_APP_KEY": os.environ["YONBIP_APP_KEY"],
              "YONBIP_APP_SECRET": os.environ["YONBIP_APP_SECRET"],
              "YONBIP_GATEWAY_URL": os.environ["YONBIP_GATEWAY_URL"] or "https://c3.yonyoucloud.com/iuap-api-gateway",
              "YONBIP_TOKEN_URL": os.environ["YONBIP_TOKEN_URL"] or "https://c3.yonyoucloud.com/iuap-api-gateway",
              "YONBIP_TENANT_ID": os.environ["YONBIP_TENANT_ID"],
              "APP_SESSION_SECRET": os.environ["APP_SESSION_SECRET"],
              "AGENT_ALLOWED_ORIGINS": os.environ["AGENT_ALLOWED_ORIGINS"],
              "AGENT_ALLOWED_ORIGIN_REGEX": os.environ["AGENT_ALLOWED_ORIGIN_REGEX"],
              "AGENT_TOKEN_TTL_SEC": "1800",
              "H5_SESSION_TTL_SEC": "604800",
          }
          if any("\n" in value or "\r" in value for value in values.values()):
              raise SystemExit("运行时密钥不能包含换行符")
          Path("/tmp/hetong-agui.env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY

      - name: Upload and start ECS release
        run: |
          set -euo pipefail
          scp /tmp/hetong-agui-image.tar.gz /tmp/hetong-agui.env docker-compose.ecs.yml \
            "root@${ECS_HOST}:/tmp/"
          ssh "root@${ECS_HOST}" "GITHUB_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          app_dir=/opt/hetong-agui
          install -d -m 750 "$app_dir/storage/uploads" "$app_dir/storage/contracts"
          chown -R 10001:10001 "$app_dir/storage"
          install -m 600 /tmp/hetong-agui.env "$app_dir/.env"
          install -m 640 /tmp/docker-compose.ecs.yml "$app_dir/docker-compose.ecs.yml"
          docker load --input /tmp/hetong-agui-image.tar.gz
          rm -f /tmp/hetong-agui-image.tar.gz /tmp/hetong-agui.env /tmp/docker-compose.ecs.yml
          cd "$app_dir"
          HETONG_IMAGE="hetong-agui:${GITHUB_SHA}" docker compose -f docker-compose.ecs.yml up -d --remove-orphans
          for attempt in $(seq 1 12); do
            health="$(docker inspect --format '{{.State.Health.Status}}' hetong-agui-app 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.ecs.yml logs --tail 100 app
          exit 1
          REMOTE
