name: Deploy to ECS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r agent/requirements-dev.txt

      - name: Python syntax check
        run: python3 -m compileall agent

      - name: Run tests
        run: python3 -m pytest agent/tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install H5 frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build H5 frontend
        working-directory: frontend
        run: npm run build

      - name: Node syntax check
        run: node --check frontend/dist/app.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
    concurrency:
      group: ecs-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ECS deployment secrets
        run: |
          set -euo pipefail
          missing=""
          for var in ECS_HOST ECS_USER ECS_SSH_PRIVATE_KEY; do
            if [ -z "$(printenv "$var" || true)" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "${missing# }" ]; then
            echo "::error::缺少 GitHub Actions Secrets：${missing# }"
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Build deployment image
        run: |
          docker build --tag "hetong-agui:${GITHUB_SHA}" .
          docker save "hetong-agui:${GITHUB_SHA}" | gzip > /tmp/hetong-agui-image.tar.gz

      - name: Upload and start ECS release
        run: |
          set -euo pipefail
          scp /tmp/hetong-agui-image.tar.gz docker-compose.ecs.yml \
            "${ECS_USER}@${ECS_HOST}:/tmp/"
          ssh "${ECS_USER}@${ECS_HOST}" "GITHUB_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          app_dir=/opt/hetong-agui
          install -d -m 750 "$app_dir/storage/uploads" "$app_dir/storage/contracts"
          chown -R 10001:10001 "$app_dir/storage"
          if [ ! -f "$app_dir/.env" ]; then
            echo "缺少 $app_dir/.env；请根据 .env.ecs.example 在 ECS 配置运行时密钥。" >&2
            exit 1
          fi
          install -m 640 /tmp/docker-compose.ecs.yml "$app_dir/docker-compose.ecs.yml"
          docker load --input /tmp/hetong-agui-image.tar.gz
          rm -f /tmp/hetong-agui-image.tar.gz /tmp/docker-compose.ecs.yml
          cd "$app_dir"
          HETONG_IMAGE="hetong-agui:${GITHUB_SHA}" docker compose -f docker-compose.ecs.yml up -d --remove-orphans
          for attempt in $(seq 1 12); do
            health="$(docker inspect --format '{{.State.Health.Status}}' hetong-agui-app 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.ecs.yml logs --tail 100 app
          exit 1
          REMOTE
